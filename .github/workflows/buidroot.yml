name: Buildroot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git cpio unzip rsync bc wget \
            file libncurses5-dev libssl-dev \
            qemu-system-arm qemu-utils

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            buildroot/dl
            ~/.buildroot-ccache
          key: br-${{ github.run_id }}
          restore-keys: br-

      - name: Clone buildroot
        run: |
          git clone --depth 1 --branch 2024.11.x \
            https://gitlab.com/buildroot.org/buildroot.git buildroot

      - name: Configure
        run: |
          cd buildroot
          make qemu_aarch64_virt_defconfig
          
          # Add Xorg + Openbox + extras
          cat >> .config << 'EOF'
          BR2_PACKAGE_OPKG=y
          BR2_PACKAGE_XORG7=y
          BR2_PACKAGE_XSERVER_XORG_SERVER=y
          BR2_PACKAGE_XSERVER_XORG_SERVER_MODULAR=y
          BR2_PACKAGE_OPENBOX=y
          BR2_PACKAGE_OBCONF=y
          BR2_PACKAGE_XINIT=y
          BR2_PACKAGE_XTERM=y
          BR2_PACKAGE_XORG_XRANDR=y
          BR2_PACKAGE_XORG_XSETROOT=y
          BR2_PACKAGE_NANO=y
          BR2_PACKAGE_VIM=y
          BR2_PACKAGE_HTOP=y
          BR2_PACKAGE_NEOFETCH=y
          BR2_PACKAGE_CURL=y
          BR2_PACKAGE_WGET=y
          BR2_PACKAGE_GIT=y
          BR2_PACKAGE_PYTHON3=y
          BR2_PACKAGE_CA_CERTIFICATES=y
          BR2_TARGET_ROOTFS_EXT2_SIZE="2G"
          EOF
          
          # Resolve Kconfig deps after manual .config edits
          make olddefconfig

      - name: Build
        run: |
          cd buildroot
          make -j$(nproc)
        timeout-minutes: 360

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: |
            buildroot/output/images/Image
            buildroot/output/images/rootfs.ext2
            buildroot/output/images/rootfs.cpio.gz
            
